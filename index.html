<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Vanel Dialundama</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Portfolio de Vanel Dialundama, développeur full-stack basé à Kinshasa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="css">
/* Layout: "costume sur mesure" — a cobalt pinstripe hero cut like the suit, then a calm paper page
   with a single reading column and a 6-col grid for projects. Red (the wall) is used sparingly. */
:root {
  --paper: #F5F6FB;
  --surface: #FFFFFF;
  --ink: #13152E;
  --muted: #565B7C;
  --line: #DADDEC;
  --cobalt: #3A4790;
  --band: #1B2142;
  --band-ink: #FFFFFF;
  --stripe: rgba(255,255,255,.065);
  --signal: #E2261C;
  --chip: #ECEEFA;
  --ok: #17865A;
  --warn: #B4570A;

  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --s-xs: .78rem; --s-sm: .9rem; --s-md: 1.05rem; --s-lg: 1.35rem; --s-xl: 2.1rem; --s-2xl: clamp(2.8rem, 7.5vw, 5.6rem);
  --wrap: 1140px;
  --radius: 14px;
  --drawer: 540px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C0E1D; --surface: #14172B; --ink: #ECEEF8; --muted: #A2A7C6; --line: #272B49;
    --cobalt: #9CA8E8; --band: #151A33; --band-ink: #FFFFFF; --stripe: rgba(255,255,255,.055);
    --signal: #FF5A4E; --chip: #1E2240; --ok: #4CD69A; --warn: #F2A65A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C0E1D; --surface: #14172B; --ink: #ECEEF8; --muted: #A2A7C6; --line: #272B49;
  --cobalt: #9CA8E8; --band: #151A33; --band-ink: #FFFFFF; --stripe: rgba(255,255,255,.055);
  --signal: #FF5A4E; --chip: #1E2240; --ok: #4CD69A; --warn: #F2A65A; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: var(--s-md); line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 4px; }

.wrap { max-width: var(--wrap); margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 720px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

.eyebrow { font-family: var(--mono); font-size: var(--s-xs); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* ---------- Nav ---------- */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--band) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--band-ink); border-bottom: 1px solid var(--stripe); }
.nav .wrap { display: flex; align-items: center; gap: 24px; min-height: 64px; }
.mono-mark { font-family: var(--display); font-style: italic; font-weight: 600; font-size: 1.5rem; text-decoration: none; letter-spacing: -.02em; line-height: 1; }
.mono-mark span { color: var(--signal); font-style: normal; }
.nav-links { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav-links::-webkit-scrollbar { display: none; }
.nav-links a { text-decoration: none; font-size: var(--s-sm); font-weight: 500; padding: 8px 12px; border-radius: 999px; white-space: nowrap; opacity: .82; transition: opacity .2s, background .2s; }
.nav-links a:hover, .nav-links a.active { opacity: 1; background: rgba(255,255,255,.12); }
.nav-cta { text-decoration: none; font-size: var(--s-sm); font-weight: 600; padding: 9px 16px; border-radius: 999px; background: #FFFFFF; color: #1B2142; white-space: nowrap; }
@media (max-width: 760px) {
  .nav .wrap { flex-wrap: wrap; gap: 0 12px; padding-block: 10px 4px; min-height: 0; }
  .nav-cta { margin-left: auto; padding: 7px 14px; }
  .nav-links { order: 3; width: 100%; margin: 6px 0 0; padding-bottom: 6px; }
  .nav-links a { padding: 6px 10px; }
}

/* ---------- Hero ---------- */
.hero { background-color: var(--band); background-image: repeating-linear-gradient(90deg, transparent 0 26px, var(--stripe) 26px 27px); color: var(--band-ink); overflow: hidden; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .9fr); gap: 48px; align-items: end; padding-block: 72px 0; }
.hero-text { padding-bottom: 80px; min-width: 0; }
.hero .eyebrow { color: rgba(255,255,255,.78); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.hero .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 4px rgba(226,38,28,.25); }
.hero h1 { font-family: var(--display); font-weight: 500; font-size: var(--s-2xl); line-height: .95; letter-spacing: -.025em; margin-top: 22px; overflow-wrap: anywhere; }
.hero h1 em { display: block; font-weight: 700; font-style: italic; }
.hero .role { font-family: var(--display); font-style: italic; font-size: var(--s-lg); margin-top: 22px; color: rgba(255,255,255,.92); }
.hero .lede { max-width: 34em; margin-top: 14px; color: rgba(255,255,255,.82); font-size: 1.1rem; }
.stack-line { font-family: var(--mono); font-size: var(--s-xs); margin-top: 26px; display: flex; flex-wrap: wrap; gap: 8px; }
.stack-line span { border: 1px solid rgba(255,255,255,.28); padding: 5px 10px; border-radius: 999px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.btn { display: inline-flex; align-items: center; gap: 10px; font: 600 var(--s-sm)/1 var(--body); padding: 14px 22px; border-radius: 999px; text-decoration: none; border: 1px solid transparent; cursor: pointer; transition: transform .2s, background .2s, color .2s; }
.btn:hover { transform: translateY(-2px); }
.btn-light { background: #FFFFFF; color: #1B2142; }
.btn-ghost { border-color: rgba(255,255,255,.5); color: #FFFFFF; background: transparent; }
.btn-ghost:hover { background: rgba(255,255,255,.1); }
.btn svg { width: 16px; height: 16px; }

.portrait { position: relative; align-self: end; justify-self: center; width: min(100%, 420px); margin: 0; }
.portrait::before { content: ""; position: absolute; inset: 22px -18px 0 18px; border: 1px solid rgba(255,255,255,.4); border-bottom: 0; border-radius: 220px 220px 0 0; }
.portrait.cutout { width: min(100%, 360px); }
.portrait.cutout::before { inset: 16% -16% 0 -16%; background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.02)); border-color: rgba(255,255,255,.22); border-radius: 999px 999px 0 0; }
.portrait.cutout::after { content: ""; position: absolute; inset: 11% -22% 0 -10%; border: 1px solid rgba(255,255,255,.14); border-bottom: 0; border-radius: 999px 999px 0 0; pointer-events: none; }
.portrait.cutout img { position: relative; z-index: 1; display: block; width: 100%; height: auto; filter: drop-shadow(0 24px 30px rgba(5,8,25,.45)); }
.portrait:not(.cutout) img, .portrait .ph { position: relative; display: block; width: 100%; height: auto; aspect-ratio: 4 / 5.2; object-fit: cover; object-position: 50% 12%; border-radius: 220px 220px 0 0; }
.portrait .ph { display: grid; place-items: center; background: rgba(255,255,255,.1); font-family: var(--display); font-style: italic; font-size: 5rem; }
.portrait .tag { position: absolute; z-index: 2; left: -26px; bottom: 40px; background: var(--surface); color: var(--ink); padding: 12px 16px; border-radius: 12px; box-shadow: 0 14px 40px rgba(10,12,40,.28); font-size: var(--s-sm); line-height: 1.35; max-width: 240px; }
.portrait .tag b { display: block; font-family: var(--mono); font-size: var(--s-xs); font-weight: 500; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
@media (max-width: 860px) {
  .hero .wrap { grid-template-columns: 1fr; gap: 8px; padding-top: 48px; }
  .hero-text { padding-bottom: 32px; }
  .portrait { width: min(100%, 340px); }
  .portrait.cutout { width: min(78%, 280px); }
  .portrait .tag { left: -8px; }
}

@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .rise.d1 { animation-delay: .08s; } .rise.d2 { animation-delay: .16s; } .rise.d3 { animation-delay: .24s; } .rise.d4 { animation-delay: .32s; }
  .portrait:not(.cutout) img { animation: unveil 1.1s cubic-bezier(.2,.7,.2,1) both .1s; }
  .portrait.cutout img { animation: rise 1s cubic-bezier(.2,.7,.2,1) both .12s; }
  .settled .rise, .settled .portrait img { animation: none; }
  @keyframes rise { from { transform: translateY(18px); opacity: .001; } to { transform: none; opacity: 1; } }
  @keyframes unveil { from { clip-path: inset(100% 0 0 0 round 220px 220px 0 0); } to { clip-path: inset(0 0 0 0 round 220px 220px 0 0); } }
}

/* ---------- Sections ---------- */
section.block { padding-block: 96px; border-bottom: 1px solid var(--line); }
@media (max-width: 720px) { section.block { padding-block: 64px; } }
.sec-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px 48px; align-items: end; margin-bottom: 48px; }
.sec-head h2 { font-family: var(--display); font-weight: 500; font-size: var(--s-xl); line-height: 1.05; letter-spacing: -.015em; margin-top: 10px; }
.sec-head h2 em { font-style: italic; color: var(--cobalt); }
.sec-head p { color: var(--muted); max-width: 36em; }
@media (max-width: 760px) { .sec-head { grid-template-columns: 1fr; margin-bottom: 32px; } }

/* About */
.about { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 56px; }
.about-text { display: grid; gap: 18px; font-size: 1.12rem; max-width: 38em; align-content: start; }
.about-text p:first-child::first-letter { font-family: var(--display); font-weight: 700; font-size: 3.4em; float: left; line-height: .82; margin: .06em .1em 0 0; color: var(--cobalt); }
.facts { display: grid; gap: 0; align-content: start; border-top: 1px solid var(--line); margin: 0; }
.facts div { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 12px; padding-block: 14px; border-bottom: 1px solid var(--line); font-size: var(--s-sm); }
.facts dt { font-family: var(--mono); font-size: var(--s-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
.facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
@media (max-width: 860px) { .about { grid-template-columns: 1fr; gap: 36px; } }
@media (max-width: 420px) { .facts div { grid-template-columns: 1fr; gap: 2px; } }

/* Projects */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.filters button { font: 500 var(--s-sm)/1 var(--body); color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 9px 15px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.filters button:hover { border-color: var(--cobalt); }
.filters button[aria-pressed="true"] { background: var(--cobalt); border-color: var(--cobalt); color: var(--paper); }
.filters .count { font-family: var(--mono); font-size: .72rem; opacity: .7; margin-left: 4px; }

.projects { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px; }
.card { grid-column: span 2; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; min-width: 0; transition: transform .25s, border-color .25s, box-shadow .25s; }
.card:hover { transform: translateY(-4px); border-color: var(--cobalt); box-shadow: 0 18px 40px -22px color-mix(in srgb, var(--cobalt) 60%, transparent); }
.card.wide { grid-column: span 3; }
.card.full { grid-column: span 6; }
.card.feature { grid-column: span 6; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; padding: 0; overflow: hidden; }
.card.feature.solo { grid-template-columns: 1fr; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: space-between; font-family: var(--mono); font-size: var(--s-xs); color: var(--muted); letter-spacing: .04em; }
.card h3 { font-family: var(--display); font-weight: 600; font-size: 1.55rem; line-height: 1.1; margin-top: 16px; letter-spacing: -.01em; }
.card p { color: var(--muted); margin-top: 10px; font-size: .98rem; }
.card ul.points { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: var(--s-sm); }
.card ul.points li { padding-left: 18px; position: relative; }
.card ul.points li::before { content: ""; position: absolute; left: 0; top: .62em; width: 8px; height: 1px; background: var(--signal); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.chips span { font-family: var(--mono); font-size: .72rem; background: var(--chip); color: var(--ink); padding: 4px 9px; border-radius: 6px; }
.card-foot { margin-top: auto; padding-top: 22px; display: flex; flex-wrap: wrap; gap: 8px 18px; }
.link { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: var(--s-sm); color: var(--cobalt); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .2s; }
.link:hover { border-color: currentColor; }
.link svg { width: 14px; height: 14px; }
.muted-note { font-size: var(--s-sm); color: var(--muted); }

.feature-body { padding: 34px 0 34px 34px; display: flex; flex-direction: column; min-width: 0; }
.feature.solo .feature-body { padding: 34px; }
.feature .card-meta { justify-content: flex-start; }
.feature h3 { font-size: 2.05rem; }
.feature-visual { background-color: var(--band); background-image: repeating-linear-gradient(90deg, transparent 0 18px, var(--stripe) 18px 19px); padding: 34px 28px; display: flex; align-items: center; justify-content: center; min-width: 0; }
.arch { width: 100%; max-width: 360px; display: grid; gap: 10px; font-family: var(--mono); font-size: .76rem; color: #FFFFFF; }
.arch .node { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.3); border-radius: 10px; padding: 12px 14px; }
.arch .node:last-child { border-style: dashed; }
.arch .node b { display: block; font-family: var(--body); font-size: .95rem; font-weight: 600; margin-bottom: 2px; }
.arch .node span { opacity: .78; }
.arch .wire { text-align: center; opacity: .75; letter-spacing: .06em; }

@media (max-width: 960px) {
  .card, .card.wide, .card.full { grid-column: span 3; }
  .card.feature { grid-column: span 6; grid-template-columns: 1fr; gap: 0; }
  .feature-body { padding: 28px; }
}
@media (max-width: 640px) {
  .projects { grid-template-columns: 1fr; }
  .card, .card.wide, .card.full, .card.feature { grid-column: auto; }
  .card { padding: 22px; }
  .feature-body, .feature.solo .feature-body { padding: 22px; }
}
.empty-filter { color: var(--muted); padding: 24px 0; }

.more-repos { margin-top: 36px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; font-size: var(--s-sm); color: var(--muted); }
.more-repos a { font-family: var(--mono); font-size: .8rem; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
.more-repos a:hover { border-color: var(--cobalt); color: var(--cobalt); }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 11rem 28px minmax(0, 1fr); gap: 0 20px; }
.timeline .when { font-family: var(--mono); font-size: var(--s-sm); color: var(--muted); padding-top: 4px; text-align: right; font-variant-numeric: tabular-nums; }
.timeline .rail { position: relative; display: flex; justify-content: center; }
.timeline .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.timeline li:first-child .rail::before { top: 12px; }
.timeline li:last-child .rail::before { bottom: auto; height: 12px; }
.timeline .rail i { position: relative; width: 13px; height: 13px; margin-top: 7px; border-radius: 50%; background: var(--paper); border: 2px solid var(--cobalt); }
.timeline li:first-child .rail i { background: var(--cobalt); box-shadow: 0 0 0 5px color-mix(in srgb, var(--cobalt) 22%, transparent); }
.timeline .what { padding-bottom: 34px; min-width: 0; }
.timeline h3 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; line-height: 1.2; }
.timeline .where { margin-top: 4px; font-weight: 500; }
.timeline .where span { color: var(--muted); font-weight: 400; }
.timeline .what p.desc { color: var(--muted); font-size: .97rem; margin-top: 6px; max-width: 40em; }
@media (max-width: 640px) {
  .timeline li { grid-template-columns: 20px minmax(0, 1fr); gap: 0 14px; }
  .timeline .when { grid-column: 2; grid-row: 1; text-align: left; padding-top: 0; }
  .timeline .rail { grid-column: 1; grid-row: 1 / span 2; }
  .timeline .what { grid-column: 2; padding-top: 2px; }
}

/* Skills */
.skills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.skill-group { padding: 28px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.skill-group h3 { font-family: var(--mono); font-weight: 500; font-size: var(--s-xs); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.skill-group ul { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
.skill-group li { font-family: var(--display); font-size: 1.3rem; font-weight: 500; line-height: 1.2; }
.skill-group li small { display: block; font-family: var(--body); font-size: .85rem; color: var(--muted); font-weight: 400; margin-top: 2px; }
@media (max-width: 900px) { .skills { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .skills { grid-template-columns: 1fr; } .skill-group { padding: 22px; } }

.human { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 56px; }
.human h3 { font-family: var(--mono); font-weight: 500; font-size: var(--s-xs); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.lang { display: grid; gap: 10px; }
.lang div { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
.lang b { font-weight: 600; }
.lang span { font-size: var(--s-sm); color: var(--muted); text-align: right; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags span { border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; font-size: var(--s-sm); }
@media (max-width: 860px) { .human { grid-template-columns: 1fr; gap: 36px; } }

/* References */
.refs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.ref { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: flex; gap: 18px; align-items: center; min-width: 0; }
.ref .initials { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-style: italic; font-weight: 600; font-size: 1.25rem; background: var(--chip); color: var(--cobalt); }
.ref b { display: block; font-size: 1.05rem; }
.ref span { color: var(--muted); font-size: var(--s-sm); }
.refs-note { margin-top: 16px; font-size: var(--s-sm); color: var(--muted); }
@media (max-width: 640px) { .refs { grid-template-columns: 1fr; } }

/* Contact */
.contact { background-color: var(--band); background-image: repeating-linear-gradient(90deg, transparent 0 26px, var(--stripe) 26px 27px); color: var(--band-ink); }
.contact .wrap { padding-block: 96px 56px; }
.contact .eyebrow { color: rgba(255,255,255,.75); }
.contact h2 { font-family: var(--display); font-weight: 500; font-size: clamp(2.3rem, 6vw, 4.2rem); line-height: 1; letter-spacing: -.02em; margin-top: 14px; max-width: 14em; }
.contact h2 em { font-style: italic; font-weight: 700; }
.contact-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 48px; }
.c-item { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.c-item small { font-family: var(--mono); font-size: var(--s-xs); letter-spacing: .1em; text-transform: uppercase; opacity: .72; }

  function downscale(file) {
    return new Promise(function (resolve) {
      if (!window.createImageBitmap) return resolve(file);
      createImageBitmap(file).then(function (bmp) {
        var max = 1200, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
        var cv = document.createElement('canvas');
        cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
        cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
        cv.toBlob(function (b) { resolve(b || file); }, file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85);
      }, function () { resolve(file); });
    });
  }

  function onPhoto(file) {
    var st = document.getElementById('adm-photo-status');
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { if (st) st.textContent = 'Format non pris en charge. Utilisez JPEG, PNG ou WebP.'; return; }
    if (st) st.textContent = 'Préparation de la photo…';
    downscale(file).then(function (blob) {
      return new Promise(function (resolve, reject) {
        var fr = new FileReader();
        fr.onload = function () { resolve({ type: blob.type || file.type, url: fr.result }); };
        fr.onerror = reject;
        fr.readAsDataURL(blob);
      });
    }).then(function (r) {
      var ext = r.type === 'image/png' ? 'png' : r.type === 'image/webp' ? 'webp' : 'jpg';
      pendingUpload = { path: 'images/photo-' + Date.now() + '.' + ext, dataUrl: r.url };
      C.meta.photo = r.url;
      var pv = document.getElementById('adm-photo-preview');
      if (pv && pv.tagName === 'IMG') pv.src = r.url; else renderDrawer();

    });
  }

    if (!artifactNs || !isDirty()) return;

    try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(C)); } catch (e) {}
    var out = JSON.parse(JSON.stringify(C)), up = null;
    if (pendingUpload && C.meta.photo === pendingUpload.dataUrl) { out.meta.photo = pendingUpload.path; up = pendingUpload; }
    function done() { if (pub) pub.textContent = 'Publier les modifications'; updateStatus(); }
    fetch('/api/save', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },

    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, j: j }; });
    }).then(function (x) {
      if (x.status === 200 && x.j.ok) {

        msg('Enregistré dans GitHub. Vercel met le site en ligne : comptez environ une minute avant que les visiteurs voient les changements.');

      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, j: j }; });
    }).then(function (x) {
      if (x.status === 200 && x.j.ok) {
        artifactNs = { server: true }; assetsNs = { server: true };
        accessCheck = Promise.resolve({ ok: true, name: '' });
        renderLogin('ok');
        setTimeout(function () { hideLogin(); enterAdmin(true); }, 700);
      } else {
        renderLogin(x.status === 429 ? 'ratelimit' : x.status === 401 ? 'denied' : 'unavailable');
        var i2 = document.getElementById('login-pass'); if (i2) i2.focus();
      }
    }, function () { renderLogin('unavailable'); });
  }

  function enterAdmin(open) {
    setLoggedIn(true);
    var d = null;
    try { d = sessionStorage.getItem(DRAFT_KEY); } catch (e) {}
    if (d) { if (d === PUBLISHED) clearDraft(); else pendingDraft = d; }
    ensureAdminUI();
    fab.hidden = false;
    if (open || pendingDraft) openAdmin();
  }

  function logout() {
    setLoggedIn(false);
    try { fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
    artifactNs = null; assetsNs = null; accessCheck = null;
    if (isDirty()) { C = JSON.parse(PUBLISHED); var y = window.scrollY; renderPage(); window.scrollTo(0, y); }
    pendingDraft = null;
    drawer.hidden = true;
    document.body.classList.remove('admin-open');
    fab.hidden = true;
  }

  function initAdmin() {
    window.addEventListener('hashchange', function () { if (location.hash === '#login') showLogin(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && loginEl && !loginEl.hidden) hideLogin(); });
    /* Triple-clic sur la photo : ouvre l'écran d'authentification admin */
    var tapCount = 0, tapLast = 0;
    document.addEventListener('click', function (e) {
      if (!e.target.closest || !e.target.closest('.portrait')) { tapCount = 0; return; }
      var now = Date.now();
      tapCount = (now - tapLast < 600) ? tapCount + 1 : 1;
      tapLast = now;
      if (tapCount >= 3) { tapCount = 0; showLogin(); }
    });
    if (location.hash === '#login') { showLogin(); return; }
    if (loggedIn()) checkAccess().then(function (a) { if (a.ok) enterAdmin(false); else setLoggedIn(false); });
  }
  /* Halo lumineux qui suit le curseur sur les cartes en verre */
  document.addEventListener('pointermove', function (e) {
    var el = e.target.closest && e.target.closest('.card, .ref, .skill-group');
    if (!el) return;
    var r = el.getBoundingClientRect();
    el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    el.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
  initAdmin();
})();
</script>
